name: EasyWarp
version: '${project.version}'
main: eu.thumus.easywarp.Main
api-version: '1.13'
author: Thumus <https://github.com/Thumuss>
website: thumus.eu
prefix: EasyWarp
softdepend: [Vault, PlaceholderAPI]

description: | 
  Un plugin pour faire des warp très facilement
  Support multilingue (FR/EN)
  Les commandes warp sont configurables dynamiquement via config.yml
  
  Commandes par défaut: /warp et /pwarp

permissions:
  easywarp.*: 
    default: op
    description: All EasyWarp permissions
    children:
      easywarp.warp.*: true
      easywarp.pwarp.*: true
  easywarp.warp.*:
    default: op
    description: All warp permissions
    children:
        easywarp.warp.use: true
        easywarp.warp.set: true
        easywarp.warp.delete: true
        easywarp.warp.edit: true
        easywarp.warp.reload: true
        easywarp.warp.share: true
        easywarp.warp.public: true
        easywarp.warp.favorite: true
        easywarp.warp.rename: true
        easywarp.warp.copy: true
        easywarp.warp.visit: true
        easywarp.warp.tpa: true
  easywarp.warp.use:
    default: not op
    description: Allow using warp
  easywarp.warp.set:
    default: op
    description: Allow setting warp
  easywarp.warp.delete:
    default: op
    description: Allow deleting warp
  easywarp.warp.edit:
    default: op
    description: Allow editing warp
  easywarp.warp.reload:
    default: op
    description: Allow reloading warp
  easywarp.warp.share:
    default: op
    description: Allow sharing warps with other players
  easywarp.warp.public:
    default: op
    description: Allow making warps public
  easywarp.warp.favorite:
    default: not op
    description: Allow marking warps as favorites
  easywarp.warp.rename:
    default: op
    description: Allow renaming warps
  easywarp.warp.copy:
    default: op
    description: Allow copying warps
  easywarp.warp.visit:
    default: not op
    description: Allow visiting other players' public warps
  easywarp.warp.tpa:
    default: not op
    description: Allow sending teleport requests to warps
  easywarp.limit.default:
    default: not op
    description: Default warp limit (5)
  easywarp.limit.vip:
    default: false
    description: VIP warp limit (15)
  easywarp.limit.premium:
    default: false
    description: Premium warp limit (50)
  easywarp.limit.unlimited:
    default: false
    description: Unlimited warps
  easywarp.bypass.cooldown:
    default: op
    description: Bypass teleportation cooldowns
  easywarp.bypass.delay:
    default: op
    description: Bypass teleportation delays
  easywarp.bypass.cost:
    default: op
    description: Bypass economy costs
  easywarp.bypass.conditions:
    default: op
    description: Bypass warp conditions
  easywarp.pwarp.*:
    default: not op
    description: Allow all pwarp
    children:
      easywarp.pwarp.use: true
      easywarp.pwarp.set: true
      easywarp.pwarp.delete: true
      easywarp.pwarp.edit: true
      easywarp.pwarp.reload: true
  easywarp.pwarp.use:
    default: not op
    description: Allow using pwarp
  easywarp.pwarp.set:
    default: not op
    description: Allow setting pwarp
  easywarp.pwarp.delete:
    default: not op
    description: Allow deleting pwarp
  easywarp.pwarp.edit:
    default: not op
    description: Allow editing pwarp
  easywarp.pwarp.reload:
    default: not op
    description: Allow reloading pwarp

