  invalid-number: "Invalid number: {0}"
  invalid-material: "Invalid material: {0}"
  warp-exists: "Warp '{0}' already exists."
  warp-limit: "You've reached your warp limit ({0})."
  not-warp-owner: "You don't own this warp."
  player-not-found: "Player '{0}' not found."
  already-shared: "Warp '{0}' is already shared with {1}."
  not-shared: "Warp '{0}' is not shared with {1}."
  max-shared-reached: "You've reached the maximum number of players to share with ({0})."
  cooldown-active: "You must wait {0} seconds before teleporting again."
