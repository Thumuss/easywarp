# EasyWarp English Messages
# Use {0}, {1}, etc. for placeholders

# Command error messages
command:
  use: "You don't have permission to use this command."
  delete: "You don't have permission to delete warps."
  set: "You don't have permission to create warps."
  reload: "You don't have permission to reload warps."
  edit: "You don't have permission to edit warps."
  share: "You don't have permission to share warps."
  public: "You don't have permission to make warps public."
  rename: "You don't have permission to rename warps."
  copy: "You don't have permission to copy warps."
  visit: "You don't have permission to visit other players' warps."
  favorite: "You don't have permission to mark warps as favorites."
  tpa: "You don't have permission to send teleport requests."
  disabled: "This command is currently disabled."
  no-args: "Please specify a warp name."
  invalid-material: "Invalid material: {0}. Using default."
  
# Command success messages
success:
  use: null  # null = no message
  delete: "Warp '{0}' has been deleted."
  set: "Warp '{0}' has been created at your location."
  reload: "Warps have been reloaded successfully."
  edit: "Warp '{0}' has been updated."
  teleport: "Teleporting to {0}..."
  share: "Warp '{0}' has been shared with {1}."
  unshare: "Stopped sharing warp '{0}' with {1}."
  public: "Warp '{0}' is now public."
  private: "Warp '{0}' is now private."
  rename: "Warp '{0}' has been renamed to '{1}'."
  copy: "Warp '{0}' has been copied to '{1}'."
  favorite-add: "Warp '{0}' has been added to your favorites."
  favorite-remove: "Warp '{0}' has been removed from your favorites."
  tpa-sent: "Teleport request sent to {0}."
  tpa-accepted: "Teleport request accepted."
  tpa-denied: "Teleport request denied."
  confirm: "Action confirmed."
  cancel: "Action cancelled."

